<!doctype html>
<html lang="en" class="testcopy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sketch</title>
<script>var APP_CFG={db:"uad36-inspect-TEST",test:true};</script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-512.png">
<style>
/* Layout: white top bar with a tangerine rule + black tab strip, one column of folding subsections.
   Palette for direct sun: pure white page, black text, every fill carries dark text and a black edge.
   Mint = required, powder blue = optional, red = missing, neon lime = done,
   highlighter yellow = where you are, tangerine = what you picked / what you're working on, lilac = camera. */
:root {
  --bg: #ffffff;
  --ink: #000000;
  --ink-2: #1c1c1c;
  --line: #000000;
  --soft: #f2f2f2;
  --bar: #ffffff;
  --tabbar: #000000;
  --tangerine: #ff8a00;
  --cyan: #ffb25c;
  --cyan-dk: #b35a00;
  --lime: #b4ff2e;
  --pink: #d9c6ff;
  --yellow: #fff200;
  --req: #c4f2d6;
  --req-ink: #0a4d27;
  --req-lt: #eefbf3;
  --opt: #a9cdf5;
  --opt-ink: #0b3570;
  --warn: #e00000;
  --warn-lt: #ffe1e1;
  --focus: #ff8a00;
  --go: #0fa84a;
  --font: "Atkinson Hyperlegible", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --bw: 3px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 19px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* ---------- Top bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--ink); border-bottom: 5px solid var(--tangerine); }
.bar-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 60px; flex-wrap: wrap; }
.bar .title { flex: 1; min-width: 160px; }
.bar .title b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .title span { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: #fff; border: 3px solid #000; color: #000; border-radius: 8px; padding: 8px 12px; font-weight: 700; font-size: 16px; min-height: 46px; display: inline-flex; align-items: center; }
.saved { font-size: 15px; font-weight: 700; white-space: nowrap; background: #fff; border: 2px solid #000; border-radius: 6px; padding: 4px 8px; }
.attn-pill { background: var(--warn); color: #fff; border: 3px solid #000; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 16px; white-space: nowrap; min-height: 46px; }
.attn-pill.ok { background: var(--lime); color: #000; }
.hc-btn[aria-pressed="true"] { background: var(--yellow); }

.tabs { display: flex; gap: 2px; overflow-x: auto; padding: 0 8px; background: var(--tabbar); scrollbar-width: none; scroll-behavior: smooth; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; color: #fff; padding: 13px 14px 10px; font-weight: 700; font-size: 17px; border-bottom: 6px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--yellow); border-bottom-color: var(--yellow); background: #262626; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
.tab .dot { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; border-radius: 11px; background: var(--warn); color: #fff; font-size: 13px; text-align: center; margin-left: 6px; padding: 0 6px; }
.tab .dot.done { background: var(--go); color: #fff; border: 2px solid #fff; }

main { max-width: 1080px; margin: 0 auto; padding: 14px 16px 140px; }

/* ---------- Legend / next missing ---------- */
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
.lg { font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 6px; border: 2px solid #000; }
.lg.req { background: var(--req); color: var(--req-ink); }
.lg.opt { background: var(--opt); color: var(--opt-ink); }
.lg.warn { background: var(--warn); color: #fff; min-height: 44px; font-size: 16px; }
.lg.warn:disabled { background: var(--lime); color: #000; }

/* ---------- Folding subsections ---------- */
.group { background: var(--bg); border: var(--bw) solid var(--line); border-radius: var(--r); margin-bottom: 14px; overflow: clip; scroll-margin-top: 140px; }
.ghead { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--soft); border: 0; text-align: left; font-weight: 700; color: #000; min-height: 64px; }
.ghead.static { background: #000; color: #fff; }
.group.open > .ghead { background: #000; color: #fff; }
.group.current > .ghead { background: var(--yellow); color: #000; border-bottom: 3px solid #000; }
.ghead .chev { font-size: 22px; width: 22px; }
.ghead .gtitle { font-size: 22px; letter-spacing: .01em; flex: 1; text-transform: uppercase; }
.ghead .count { font-size: 15px; font-weight: 700; }
.gstat { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 2px solid #000; white-space: nowrap; }
.gstat.miss { background: var(--warn); color: #fff; }
.gstat.ok { background: var(--lime); color: #000; }
.gfoot { padding: 14px 16px; border-top: 3px solid #000; background: var(--soft); display: flex; justify-content: flex-end; }
.btn.done { background: var(--lime); border-color: #000; color: #000; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px var(--tangerine) inset; } 100% { box-shadow: none; } }

/* ---------- Fields ---------- */
.fields { display: grid; grid-template-columns: 1fr; }
.field { padding: 12px 16px 14px 22px; border-bottom: 2px solid #c8c8c8; position: relative; min-width: 0; scroll-margin-top: 150px; }
.field:last-child { border-bottom: 0; }
.field::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: var(--opt); }
.field.req::before { background: var(--req); }
.field.missing::before { background: var(--warn); }
.field.missing { background: #fff; }
.flabel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: 700; font-size: 19px; }
.flabel .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--opt); color: var(--opt-ink); }
.field.req .flabel .tag { background: var(--req); color: var(--req-ink); }
.field.missing .flabel .tag { background: var(--warn); color: #fff; }
.flabel .fid { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-weight: 400; }
.pcount { background: var(--lime); color: #000; border: 2px solid #000; border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.help { font-size: 16px; color: var(--ink-2); margin: -4px 0 8px; }
.calc { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.calc-text { font-size: 17px; font-weight: 700; background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 10px 12px; }
.info { background: var(--soft); color: #000; font-size: 16px; padding: 10px 14px; border-radius: 8px; border: 2px solid #000; font-weight: 700; }
.info.remind { background: var(--yellow); }
.note-field::before { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: var(--bw) solid #000; background: #fff; border-radius: 8px; padding: 10px 15px; min-height: 52px; font-size: 18px; line-height: 1.2; display: inline-flex; align-items: center; gap: 9px; text-align: left; color: #000; }
.chip .box { width: 24px; height: 24px; border: 3px solid #000; border-radius: 4px; flex: none; display: grid; place-items: center; background: #fff; }
.chip.radio .box { border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--cyan); font-weight: 700; box-shadow: 0 0 0 2px #000 inset; }
.chip[aria-pressed="true"] .box { background: #000; }
.chip[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 5px; border: 3px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.chip.radio[aria-pressed="true"] .box::after { width: 10px; height: 10px; border: 0; background: #fff; border-radius: 50%; transform: none; }
.yn .chip { min-width: 104px; justify-content: center; }

input.txt, select.txt, textarea.txt { width: 100%; border: var(--bw) solid #000; border-radius: 8px; padding: 11px 12px; background: #fff; min-height: 52px; font-size: 19px; color: #000; }
input.txt:focus, select.txt:focus, textarea.txt:focus { outline: 4px solid var(--focus); outline-offset: 0; }
input.num { max-width: 240px; font-variant-numeric: tabular-nums; }
textarea.txt { min-height: 100px; resize: vertical; line-height: 1.45; }
.limit { font-size: 15px; color: var(--ink-2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 700; }
.limit.over { color: var(--warn); }

.stepper { display: inline-flex; align-items: center; border: var(--bw) solid #000; border-radius: 8px; overflow: hidden; }
.stepper button { width: 58px; height: 52px; border: 0; background: var(--soft); font-size: 28px; font-weight: 700; color: #000; }
.stepper output { min-width: 66px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Appliances ---------- */
.chip.appl-on { background: var(--cyan); }
.appl-edit { flex-basis: 100%; margin: 2px 0 6px; border: 3px solid #000; border-radius: 10px; padding: 12px; background: var(--yellow); display: grid; gap: 10px; }
.appl-title { font-size: 20px; font-weight: 700; }
.appl-edit .row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Photos ---------- */
.photo-slot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.cam { display: inline-flex; align-items: center; gap: 8px; border: 3px solid #000; color: #000; background: var(--pink); border-radius: 10px; padding: 12px 18px; min-height: 58px; font-weight: 700; font-size: 18px; position: relative; overflow: hidden; }
.cam input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.cam.lib { background: #fff; }
.cam svg { width: 24px; height: 24px; flex: none; }
.thumb { width: 140px; border-radius: 8px; overflow: hidden; border: 3px solid #000; background: var(--soft); padding: 0; text-align: left; }
.thumb img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; max-width: 100%; }
.thumb span { display: block; font-size: 14px; font-weight: 700; padding: 5px 7px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb.req { border-color: var(--req); }
.group.extra { border-style: dashed; }
.extra-photos { padding: 14px 16px; background: var(--soft); display: flex; flex-direction: column; gap: 10px; }
.extra-photos h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 10px; align-items: center; }

/* ---------- Lists (rooms, baths, etc.) ---------- */
.item { border-top: 3px solid #000; }
.item-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; flex-wrap: wrap; }
.item.open > .item-head { background: #ffdcb5; }
.item-head .name { flex: 1; min-width: 200px; font-weight: 700; font-size: 20px; color: #000; border: 0; background: none; text-align: left; padding: 8px 0; }
.item-head .name small { font-weight: 700; color: var(--ink-2); font-size: 15px; margin-left: 10px; }
.item-head .badge { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--warn); color: #fff; border: 2px solid #000; white-space: nowrap; }
.item-head .badge.ok { background: var(--lime); color: #000; }
.item-body { border-left: 8px solid var(--cyan); margin-left: 0; }
.btn { border: 3px solid #000; background: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 700; min-height: 50px; font-size: 18px; color: #000; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--tangerine); }
.btn.cyan { background: var(--opt); }
.btn.danger { color: var(--warn); }
.btn.danger.solid { background: var(--warn); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 44px; font-size: 16px; }
.add-row { padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; border-top: 3px solid #000; background: var(--soft); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--warn-lt); color: var(--warn); font-weight: 700; border-top: 2px solid var(--warn); }

/* ---------- CRS ---------- */
.crs { display: grid; gap: 12px; }
.crs-btn { position: relative; overflow: hidden; justify-self: start; }
.crs-btn input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }
.crs-loaded { font-weight: 700; background: var(--lime); border: 2px solid #000; border-radius: 6px; padding: 6px 10px; justify-self: start; font-size: 16px; }
.crs-table { border-collapse: collapse; width: 100%; font-size: 17px; }
.crs-table th, .crs-table td { text-align: left; vertical-align: top; border-bottom: 2px solid #c8c8c8; padding: 6px 8px; }
.crs-table th { width: 40%; }

/* ---------- Home ---------- */
.new-form { background: #fff; border: 3px solid #000; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 22px; box-shadow: 8px 8px 0 var(--tangerine); }
.new-form h2 { font-size: 22px; }
.new-form .flabel .tag { background: var(--req); color: var(--req-ink); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { border: 3px solid #000; border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #fff; text-align: left; }
.card b { font-size: 20px; }
.card .meta { font-size: 16px; color: var(--ink-2); font-weight: 700; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.prog { height: 12px; background: #ddd; border-radius: 6px; overflow: hidden; border: 2px solid #000; }
.prog i { display: block; height: 100%; background: var(--req); }

/* ---------- Attention ---------- */
.att { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 2px solid #c8c8c8; flex-wrap: wrap; }
.att .sev { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 4px; flex: none; border: 2px solid #000; }
.sev.Required, .sev.Photo { background: var(--warn); color: #fff; }
.sev.Recommended { background: var(--tangerine); color: #000; }
.sev.Check { background: var(--yellow); color: #000; }
.att .what { flex: 1; min-width: 200px; font-weight: 700; }
.att .what small { display: block; color: var(--ink-2); font-size: 15px; }
.att.overridden { opacity: .6; }
.att .ovr { width: 100%; display: flex; gap: 8px; }
.att .ovr input { flex: 1; }

/* ---------- Summaries ---------- */
.sum { padding: 14px 16px; border-top: 2px solid #c8c8c8; display: grid; gap: 10px; }
.sum h3 { font-size: 19px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.sum h3 .fid { font-family: var(--mono); font-size: 14px; color: var(--ink-2); font-weight: 400; }
.sum .auto { background: var(--soft); border: 2px solid #000; border-radius: 8px; padding: 12px; font-size: 18px; line-height: 1.5; white-space: pre-wrap; }
.sum .auto.empty { color: var(--ink-2); font-style: italic; }
.sum .dropped { font-size: 16px; color: #8a3b00; font-weight: 700; }
.sum .row, .exp .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Gallery ---------- */
.gal-sec h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .04em; padding: 14px 16px 6px; }
.gal { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 16px 16px; }
.missing-photos { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
.missing-photos button { border: 3px solid var(--warn); background: var(--warn-lt); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 16px; font-weight: 700; }
.missing-photos button.sug { border-color: #000; background: #fff; color: #000; }

/* ---------- Sheets, jump, toast, undo ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet { background: #fff; border-radius: 14px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; border: 3px solid #000; }
.sheet img { display: block; width: 100%; max-height: 60vh; object-fit: contain; background: #000; }
.sheet .body { padding: 16px; display: grid; gap: 12px; }
.sheet .row { display: flex; gap: 10px; flex-wrap: wrap; }
.sheet.jump { align-self: start; margin-top: 40px; }
.jump-list { display: grid; gap: 6px; max-height: 60vh; overflow: auto; }
.jump-item { text-align: left; border: 2px solid #000; background: #fff; border-radius: 8px; padding: 10px 14px; font-weight: 700; font-size: 18px; padding-left: 34px; }
.jump-item.top { background: #000; color: #fff; padding-left: 14px; }
.jump-item small { display: block; font-size: 14px; color: var(--ink-2); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #000; color: var(--yellow); padding: 14px 20px; border-radius: 10px; z-index: 60; font-weight: 700; max-width: calc(100% - 32px); font-size: 18px; border: 3px solid var(--yellow); }
.undo-bar { position: fixed; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 61; background: var(--yellow); border: 3px solid #000; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 700; max-width: 760px; margin: 0 auto; }
.undo-bar span { flex: 1; min-width: 180px; }

.exp { padding: 16px; display: grid; gap: 12px; border-top: 2px solid #c8c8c8; }
.exp:first-of-type { border-top: 0; }
.exp h3 { font-size: 20px; }
.exp p { margin: 0; color: var(--ink-2); font-size: 17px; max-width: 65ch; }
.warn-box { background: var(--warn-lt); color: var(--warn); border: 2px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 17px; font-weight: 700; }

@media (min-width: 900px) {
  .fields.two { grid-template-columns: 1fr 1fr; }
  .fields.two .field.wide { grid-column: 1 / -1; }
  .new-form { grid-template-columns: 2fr 1fr auto; align-items: end; }
}

/* Outdoor mode: even heavier type and borders */
html.hc body { font-size: 21px; }
html.hc .chip { font-size: 20px; min-height: 58px; border-width: 4px; }
html.hc .flabel, html.hc .help, html.hc .chip { font-weight: 700; }
html.hc .field { border-bottom-color: #000; }
html.hc .group { border-width: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.fatal { margin: 16px; padding: 18px 20px; border: 4px solid var(--warn); border-radius: 12px; background: #fff; color: #000; font-size: 19px; }
.fatal h2 { color: var(--warn); margin: 0 0 8px; }
.fatal-msg { font-family: ui-monospace, Menlo, monospace; font-size: 15px; background: #f2f2f2; padding: 8px 10px; border-radius: 6px; word-break: break-word; }

.rename { display: flex; gap: 8px; align-items: center; flex: 1; flex-wrap: wrap; }
.rename .txt { flex: 1; min-width: 200px; }

.review { display: grid; gap: 0; border: 2px solid #000; border-radius: 8px; overflow: hidden; }
.rv-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #bbb; flex-wrap: wrap; background: #fff; }
.rv-row:last-child { border-bottom: 0; }
.rv-l { font-weight: 700; min-width: 190px; }
.rv-v { flex: 1; min-width: 160px; }
.rv-v.empty { color: var(--warn); font-weight: 700; }

/* keep the open room's name in view while scrolling through it */
.item.open > .item-head { position: sticky; top: calc(var(--barh, 120px) + env(safe-area-inset-top, 0px)); z-index: 6; border-bottom: 3px solid #000; }

/* pale fills need an edge to read in sun */
.flabel .tag, .lg.req, .lg.opt { border: 2px solid #000; }
.cam { font-weight: 700; }
.item.open > .item-head { background: #ffdcb5; }
.chip[aria-pressed="true"] .box { background: #000; }

/* stoplight check beside each subsection: grey until reviewed, green when reviewed with nothing missing */
.ghead-row { display: flex; align-items: stretch; background: var(--soft); }
.group.open > .ghead-row { background: #000; }
.group.current > .ghead-row { background: var(--yellow); border-bottom: 3px solid #000; }
.group.open > .ghead-row .ghead { background: transparent; color: inherit; }
.group.open > .ghead-row { color: #fff; } .group.current > .ghead-row { color: #000; }
.ghead-row .ghead { flex: 1; background: transparent; }
.gcheck { flex: none; width: 52px; height: 52px; margin: 6px 0 6px 10px; align-self: center; border-radius: 50%; border: 3px solid #000; background: #d9d9d9; color: #8a8a8a; font-size: 28px; font-weight: 900; line-height: 1; display: grid; place-items: center; padding: 0; }
.gcheck.on { background: var(--go); color: #fff; }

/* section footer: big "done" button with the same stoplight check */
.btn.donecheck { background: #fff; border: 3px solid #000; color: #000; display: inline-flex; align-items: center; gap: 12px; font-weight: 700; padding: 8px 18px 8px 10px; min-height: 60px; }
.gcheck.sm { width: 42px; height: 42px; margin: 0; font-size: 24px; transition: background .2s, color .2s; }

// Year pickers count back from the current year, so the list stays current every year
function yearOpts(from, remodel) {
  const now = new Date().getFullYear(); const out = [];
  for (let y = now; y >= from; y--) out.push([String(y), String(y)]);
  out.push(['Before ' + from, 'Before ' + from]);
  if (remodel) out.push(['Original', 'Original / never remodeled']);
  out.push(['Unknown', 'Unknown']); return out;
}
const saleOn = d => d.saleStatus === 'Listed for Sale' || d.saleStatus === 'In Escrow';
// Rooms counted in the room total: main living rooms only (no entries, foyers, pantries, nooks, halls, utility spaces)
const COUNT_ROOMS = ['Living Room','Great Room','Family Room','Dining Room','Den','Office','Study','Library','Recreation Room','Game Room','Media Room','Theater','Music Room / Studio','Art Studio','Gym','Sunroom','Loft','Bonus Room'];
function reviewItems(ins, rows) {
  return rows.map(([label, sec, k]) => {
    const { f, g } = findFieldIn(sec, k); const d = ins.data[sec] || {};
    if (!f || !isShown(f, d, ins)) return null;
    const value = valText(f, d[k], d); if (!value && !isReq(f, d, ins)) return null; // skip optional items left blank
    return { label, value, go: `${sec}|f-${sec}-${k}||${g ? g.id : ''}` };
  }).filter(Boolean);
}
function findFieldIn(secId, k) { const sec = SECTIONS.find(s => s.id === secId); if (sec) for (const g of sec.groups) for (const f of g.fields) if (f.k === k) return { f, g }; return {}; }
function pubrecItems(ins) {
  const c = ins.data.property.crs || {}; const L = ins.lists; const n = v => v ? Number(v).toLocaleString() : '—';
  const fb = L.baths.filter(b => b.kind === 'FullBathroom').length, hb = L.baths.filter(b => b.kind === 'HalfBathroom').length;
  return [
    { label: 'Living area (sq. ft.)', value: `Assessor ${n(c.sqftAssessor || c.sqft)} · MLS ${n(c.sqftMls)}` },
    { label: 'Year built', value: `Assessor ${c.yearBuilt || '—'} · MLS ${c.yearBuiltMls || '—'}` },
    { label: 'Bedrooms', value: `Assessor ${c.beds || '—'} · MLS ${c.bedsMls || '—'} · Your count ${L.bedrooms.length}` },
    { label: 'Baths', value: `Assessor ${c.baths || '—'} · MLS ${c.bathsMls || '—'} · Your count ${fb} full${hb ? ', ' + hb + ' half' : ''}` },
  ].concat(c.rooms || c.roomsMls ? [{ label: 'Total rooms', value: `Assessor ${c.rooms || '—'} · MLS ${c.roomsMls || '—'}` }] : []);
}
function sketchItems(ins) {
  const S = ins && ins.sketch; if (!S || !S.totals) return [{ label: 'Sketch', value: '' }];
  const T = S.totals, f = n => (n || 0).toLocaleString() + ' sf', out = [];
  out.push({ label: 'Finished above grade', value: f(T.agFin) });
  if (T.agNon) out.push({ label: 'Finished above grade – nonstandard', value: f(T.agNon) });
  if (T.agUnf) out.push({ label: 'Unfinished above grade', value: f(T.agUnf) });
  if (T.bgFin || T.bgNon || T.bgUnf) out.push({ label: 'Below grade (finished / nonstd. / unfinished)', value: [T.bgFin, T.bgNon, T.bgUnf].map(n => (n || 0).toLocaleString()).join(' / ') + ' sf' });

}

/* Unit-level lists built from every room so nothing is entered twice */
function unitList(ins, key) {
  const s = new Set();
  ['rooms', 'bedrooms', 'baths', 'kitchens'].forEach(l => (ins.lists[l] || []).forEach(it => (it[key] || []).forEach(v => s.add(v))));
  return [...s];

  document.getElementById('skLevels').innerHTML = used.map(l => `<button class="chip lv ${l === SK.level ? 'on' : ''}" data-lv="${l}">${LEVEL_NAME(l)}${below(l) ? ' <small>below grade</small>' : ''}</button>`).join('') + `<button class="chip lv add" id="skAddLv">+ Level</button>`;
  document.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { if (SK.drawId) return toast('Finish or close the area you are drawing first'); SK.level = b.dataset.lv; SK.sel = null; renderLevels(); renderPanel(); draw(); markDirty(); });
  document.getElementById('skAddLv').onclick = () => openSheet(`<h3>Add a level</h3><p class="help">Levels B1–B5 are below grade (a level that is even partly below grade counts as below grade). Other levels show as faint dashed outlines so you can line up the floors.</p>
    <div class="grid-btns">${LEVELS.map(l => `<button class="btn ${used.includes(l) ? 'dim' : ''}" data-newlv="${l}">${LEVEL_NAME(l)}</button>`).join('')}</div><div class="row"><button class="btn" data-close>Cancel</button></div>`, sh => sh.querySelectorAll('[data-newlv]').forEach(b => b.onclick = () => { SK.level = b.dataset.newlv; SK.sel = null; closeSheet(); renderLevels(); renderPanel(); fitViewIfEmpty(); draw(); markDirty(); }));
}
function fitViewIfEmpty() { if (!SK.sk.areas.some(a => a.level === SK.level)) { /* keep the view where it is so floors line up */ } }
function renderInfo() {
  const el = document.getElementById('skInfo'); if (!el) return; const T = totals();
  const fmt = n => n ? n.toLocaleString() : '0';
  el.innerHTML = `<b>Finished above grade ${fmt(T.agFin)} sf</b>${T.agNon ? ` · nonstandard ${fmt(T.agNon)}` : ''}${T.bgFin || T.bgNon ? ` · below grade ${fmt(T.bgFin + T.bgNon)}` : ''}${T.gar.length ? ` · garage ${fmt(T.gar.reduce((t, x) => t + x.sf, 0))}` : ''} <button class="btn sm" id="skTotals">Totals</button>`;
  document.getElementById('skTotals').onclick = openTotals;
}
function renderPanel() {
  const el = document.getElementById('skPanel'); if (!el) return;
  const a = curArea(); const sel = SK.sel;
  let ctxHtml = '';
  if (SK.curve) ctxHtml = curveCtx();
  if (ctxHtml) {} else if (SK.mode === 'start') ctxHtml = `<div class="ctx"><b>Tap the starting corner</b> of the ${esc(defOf(SK.pendingDef).name)} on the grid (it snaps to existing corners). <button class="btn sm" id="skCancelStart">Cancel</button></div>`;
  else if (SK.mode === 'label') ctxHtml = `<div class="ctx"><b>Tap where “${esc(SK.pendingLabel)}” goes.</b> <button class="btn sm" id="skCancelLabel">Cancel</button></div>`;
  else if (a) ctxHtml = `<div class="ctx"><b>Drawing: ${esc(a.name || defOf(a.def).name)}</b> · ${a.pts.length - 1} wall${a.pts.length === 2 ? '' : 's'} · type a length, then an arrow. It closes by itself when you get back to the green start.${a.pts.length >= 2 ? ' <button class="btn sm" id="skCurveLast">⌒ Curve last wall</button>' : ''}</div>`;
  else if (sel && sel.type === 'wall') { const ar = SK.sk.areas.find(x => x.id === sel.id); const ws = walls(ar).find(w => w[0] === sel.i); const L = ws ? r1(wallLen(ws[1], ws[2])) : 0; const closing = ar.closed && sel.i === ar.pts.length - 1;
    ctxHtml = `<div class="ctx"><b>Wall: ${L.toFixed(1)} ft</b>${closing ? ' · closing wall (adjusts by itself)' : ''} of ${esc(ar.name || defOf(ar.def).name)}
      ${closing ? '' : `<label class="inl">New length <input id="skWallLen" class="txt num" inputmode="decimal" value="${L.toFixed(1)}"></label><button class="btn primary sm" id="skWallSet">Apply</button>`}
      <button class="btn sm" id="skCurve">⌒ ${ar.arcs && ar.arcs[sel.i] ? 'Edit curve' : 'Curve this wall'}</button><button class="btn sm" id="skWallArea">Select the area</button></div>`; }
  else if (sel && sel.type === 'area') { const ar = SK.sk.areas.find(x => x.id === sel.id); const C = computeAreas(); const d = defOf(ar.def);
    ctxHtml = `<div class="ctx"><b>${esc(ar.name || d.name)}</b> · ${Math.round(C.net.get(ar.id) || 0).toLocaleString()} sf${C.net.get(ar.id) !== C.gross.get(ar.id) ? ` net (${Math.round(C.gross.get(ar.id)).toLocaleString()} gross)` : ''} · ${esc(BUCKETS[d.bucket].l)}
      <button class="btn sm" id="skAreaProps">Properties</button><button class="btn sm" id="skRot90">↻ 90°</button><button class="btn sm" id="skRotX">Rotate…</button><button class="btn sm" id="skReopen">Edit walls</button><button class="btn sm danger" id="skDel">Delete</button>
      <span class="help">Drag it to move it.</span></div>`; }
  else if (sel && sel.type === 'label') { const l = SK.sk.labels.find(x => x.id === sel.id);
    ctxHtml = `<div class="ctx"><b>Label: ${esc(l.text)}</b> <button class="btn sm" id="skLblEdit">Change text</button><button class="btn sm danger" id="skDel">Delete</button><span class="help">Drag it to move it.</span></div>`; }
  else ctxHtml = `<div class="ctx muted">Tap a wall to change its length, tap an area for its properties. Two fingers to zoom and move.</div>`;
  const ent = SK.entry || '';
  el.innerHTML = ctxHtml + `
  <div class="pad">
    <div class="keys">
      <div class="entry" id="skEntry">${ent ? esc(ent) + ' ft' : 'length'}</div>
      ${['7','8','9','4','5','6','1','2','3','.','0'].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}<button class="key bs" id="skBs" title="Backspace: digit, then last wall">⌫</button>
    </div>
    ${SK.dial ? `<div class="dialbox">${dialSvg()}<div class="dlread" id="dlRead"></div>
      <div class="dlrow"><button class="btn primary" id="dlDraw">Draw wall</button><button class="btn" id="dlClose">Arrows</button></div>
      <div class="dlrow"><button class="btn sm" data-dstep="-1">−1°</button><button class="btn sm" data-dstep="-0.5">−½°</button><button class="btn sm" data-dstep="0.5">+½°</button><button class="btn sm" data-dstep="1">+1°</button></div>
      <div class="dlrow turns"><span class="help">Turn left</span><button class="btn sm" data-dturn="22.5">22.5</button><button class="btn sm" data-dturn="45">45</button><button class="btn sm" data-dturn="90">90</button></div>
      <div class="dlrow turns"><span class="help">Turn right</span><button class="btn sm" data-dturn="-22.5">22.5</button><button class="btn sm" data-dturn="-45">45</button><button class="btn sm" data-dturn="-90">90</button></div></div>` : `<div class="arrows">
      ${[['↖', -1, -1], ['↑', 0, -1], ['↗', 1, -1], ['←', -1, 0], ['ang'], ['→', 1, 0], ['↙', -1, 1], ['↓', 0, 1], ['↘', 1, 1]].map(x => x[0] === 'ang' ? `<button class="key arr angle" id="skAngle">∠ Angle</button>` : `<button class="key arr" data-dx="${x[1]}" data-dy="${x[2]}">${x[0]}</button>`).join('')}
    </div>`}
    <div class="acts">
      <button class="btn primary big" id="skNew">+ New area</button>
      <button class="btn big" id="skClose" ${a ? '' : 'disabled'}>Close area</button>
      <button class="btn big" id="skDone" ${a ? '' : 'disabled'}>Stop (leave open)</button>
      <button class="btn big" id="skLabel">Aa Label</button>
      <button class="btn big" id="skFit">Fit to screen</button>
    </div>
  </div>`;
  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === '.' && SK.entry.includes('.')) return; if (SK.entry.includes('.') && SK.entry.split('.')[1].length >= 1) return toast('Lengths are to 0.1 ft'); SK.entry += k; renderPanel(); });
  el.querySelectorAll('[data-dx]').forEach(b => b.onclick = () => addWall(+b.dataset.dx, +b.dataset.dy));
  on('skBs', backspace);
  on('skAngle', () => { if (!curArea()) return toast('Start an area first'); const ld = lastDir(); SK.dial = { ang: SK.lastAngle ?? (ld ?? 0) }; renderPanel(); });
  on('skNew', openDefs); on('skClose', closeArea); on('skDone', () => finishArea(false)); on('skLabel', () => openLabels()); on('skFit', () => { fitView(); draw(); });
  on('skCancelStart', () => { SK.mode = 'select'; renderPanel(); }); on('skCancelLabel', () => { SK.mode = 'select'; renderPanel(); });
  on('skWallSet', () => { const v = parseFloat(document.getElementById('skWallLen').value); const ar = SK.sk.areas.find(x => x.id === sel.id); setWallLength(ar, sel.i, Math.round(v * 10) / 10); });
  on('skWallArea', () => { SK.sel = { type: 'area', id: sel.id }; draw(); renderPanel(); });
  on('skAreaProps', () => openAreaProps(SK.sk.areas.find(x => x.id === sel.id)));
  on('skRot90', () => { rotateArea(SK.sk.areas.find(x => x.id === sel.id), -90); renderPanel(); });
  on('skRotX', () => askNumber('Rotate this area', 'Degrees (counter-clockwise; use a minus sign for clockwise)', '', v => { rotateArea(SK.sk.areas.find(x => x.id === sel.id), v); renderPanel(); }));
  on('skReopen', () => { const ar = SK.sk.areas.find(x => x.id === sel.id); pushUndo(); ar.closed = false; SK.drawId = ar.id; SK.mode = 'draw'; SK.sel = null; toast('Press ⌫ to remove walls, or add walls with the keypad'); markDirty(); draw(); renderPanel(); });
  on('skDel', () => { if (confirm('Delete this ' + (sel.type === 'label' ? 'label' : 'area') + '?')) deleteSel(); });
  on('skLblEdit', () => openLabels(SK.sk.labels.find(x => x.id === sel.id)));
  on('skCurve', () => startCurve(SK.sk.areas.find(x => x.id === sel.id), sel.i));
  on('skCurveLast', () => { const ca = curArea(); startCurve(ca, ca.pts.length - 2); });
  if (SK.dial) wireDial(el); if (SK.curve) wireCurve(el);
  renderLevels();
}

/* ---------- sheets ---------- */
function openSheet(html, wire) { const bg = document.getElementById('skSheetBg'), sh = document.getElementById('skSheet'); sh.innerHTML = html; bg.hidden = false; sh.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet); if (wire) wire(sh); }
function closeSheet() { document.getElementById('skSheetBg').hidden = true; }
function askNumber(title, help, val, fn) {
  openSheet(`<h3>${esc(title)}</h3><p class="help">${esc(help)}</p><input class="txt" id="skNum" inputmode="decimal" value="${esc(val)}"><div class="row"><button class="btn primary" id="skNumOk">OK</button><button class="btn" data-close>Cancel</button></div>`,
    sh => { const i = sh.querySelector('#skNum'); i.focus(); sh.querySelector('#skNumOk').onclick = () => { const v = parseFloat(i.value); if (isNaN(v)) return toast('Enter a number'); closeSheet(); fn(v); }; });
}
function defsHtml(q, pickAttr) {
  const groups = {}; allDefs().filter(d => !q || (d.name + ' ' + d.code).toLowerCase().includes(q)).forEach(d => (groups[d.grp] = groups[d.grp] || []).push(d));
  return Object.entries(groups).map(([g, ds]) => `<h4>${esc(g)}</h4><div class="grid-btns">${ds.map(d => `<button class="btn" ${pickAttr}="${esc(d.id)}"><small>${esc(d.code)}</small> ${esc(d.name)}</button>`).join('')}</div>`).join('') || '<p class="help">No match – add it as a new area type.</p>';
}
function openDefs() {
  if (curArea()) return toast('Close or stop the current area first');
  openSheet(`<h3>New area – what is it?</h3><p class="help">Living areas count as above or below grade from the level you are on (${LEVEL_NAME(SK.level)}).</p>
    <input class="txt" id="skDefQ" placeholder="Search area types" autocomplete="off"><div id="skDefList">${defsHtml('', 'data-def')}</div>
    <div class="row"><button class="btn" id="skNewDef">+ New area type</button><button class="btn" data-close>Cancel</button></div>`, sh => {
      const wire = () => sh.querySelectorAll('[data-def]').forEach(b => b.onclick = () => { closeSheet(); startArea(b.dataset.def); });
      sh.querySelector('#skDefQ').oninput = e => { sh.querySelector('#skDefList').innerHTML = defsHtml(e.target.value.trim().toLowerCase(), 'data-def'); wire(); }; wire();
      sh.querySelector('#skNewDef').onclick = () => newDefSheet(id => startArea(id)); });
}
function newDefSheet(then, preset) {
  openSheet(`<h3>New area type</h3><p class="help">Your name is printed on the sketch. The bucket decides which UAD total the square footage goes into.</p>
    <label>Name <input class="txt" id="ndName" value="${esc(preset || '')}" placeholder="e.g. Meditation Pavilion"></label>
    <label>Short code <input class="txt" id="ndCode" maxlength="5" placeholder="e.g. OTH"></label>
    <h4>Counts toward</h4><div class="grid-btns">${Object.entries(BUCKETS).map(([k, b]) => `<button class="btn" data-bk="${k}">${esc(b.l)}</button>`).join('')}</div>
    <div class="row"><button class="btn" data-close>Cancel</button></div>`, sh => sh.querySelectorAll('[data-bk]').forEach(b => b.onclick = async () => {
      const name = sh.querySelector('#ndName').value.trim(); if (!name) return toast('Type a name first');
      const bk = b.dataset.bk; const code = sh.querySelector('#ndCode').value.trim().toUpperCase() || { LIV: 'FIN', LIVN: 'FIN', UNF: 'UNF', GAR: 'GAR', OUT: 'P/P', OB: 'OTH', ADU: 'ADU', AMEN: 'AMN', NCA: 'NCA' }[bk];
      const grp = { LIV: 'Living area', LIVN: 'Living area', UNF: 'Living area', GAR: 'Garage / carport', OUT: 'Patio / porch', OB: 'Outbuilding', ADU: 'ADU', AMEN: 'Amenity', NCA: 'Not calculated' }[bk];
      const d = { id: 'c_' + uid(), code, name, bucket: bk, grp, custom: true }; SK.lib.defs.push(d); await saveLib(); closeSheet(); toast(`“${name}” saved to your area types`); then(d.id); }));
}
function openAreaProps(a) {
  const d = defOf(a.def);
  openSheet(`<h3>Area properties</h3>
    <label>Name on the sketch <input class="txt" id="apName" value="${esc(a.name || '')}" placeholder="${esc(d.name)}"></label>
    <p><b>Type:</b> ${esc(d.code)} – ${esc(d.name)} · <span class="help">${esc(BUCKETS[d.bucket].l)}</span></p>
    <h4>Change type</h4><input class="txt" id="apQ" placeholder="Search area types"><div id="apList" class="scrolly">${defsHtml('', 'data-apdef')}</div>
    <h4>Level</h4><div class="grid-btns">${LEVELS.map(l => `<button class="btn ${l === a.level ? 'primary' : ''}" data-aplv="${l}">${LEVEL_NAME(l)}</button>`).join('')}</div>
    <div class="row"><button class="btn primary" id="apSave">Save</button><button class="btn" id="apNewDef">+ New area type</button><button class="btn" data-close>Cancel</button></div>`, sh => {
      let pick = a.def, lv = a.level;
      const wire = () => sh.querySelectorAll('[data-apdef]').forEach(b => b.onclick = () => { pick = b.dataset.apdef; sh.querySelectorAll('[data-apdef]').forEach(x => x.classList.toggle('primary', x === b)); });
      sh.querySelector('#apQ').oninput = e => { sh.querySelector('#apList').innerHTML = defsHtml(e.target.value.trim().toLowerCase(), 'data-apdef'); wire(); }; wire();
      sh.querySelectorAll('[data-aplv]').forEach(b => b.onclick = () => { lv = b.dataset.aplv; sh.querySelectorAll('[data-aplv]').forEach(x => x.classList.toggle('primary', x === b)); });
      sh.querySelector('#apNewDef').onclick = () => newDefSheet(id => { pushUndo(); a.def = id; markDirty(); draw(); renderPanel(); });
      sh.querySelector('#apSave').onclick = () => { pushUndo(); a.name = sh.querySelector('#apName').value.trim() || undefined; a.def = pick; if (lv !== a.level) { a.level = lv; SK.level = lv; } closeSheet(); markDirty(); draw(); renderPanel(); };
    });
}
function openLabels(editing) {
  openSheet(`<h3>${editing ? 'Change label' : 'Add a label'}</h3><input class="txt" id="lbQ" placeholder="Search or type a new label" autocomplete="off">
    <div id="lbList" class="grid-btns scrolly"></div><div class="row"><button class="btn primary" id="lbUse">Use what I typed (and save it)</button><button class="btn" data-close>Cancel</button></div>`, sh => {
      const q = sh.querySelector('#lbQ');
      const list = () => { const t = q.value.trim().toLowerCase(); sh.querySelector('#lbList').innerHTML = allLabels().filter(l => !t || l.toLowerCase().includes(t)).map(l => `<button class="btn" data-lb="${esc(l)}">${esc(l)}</button>`).join(''); sh.querySelectorAll('[data-lb]').forEach(b => b.onclick = () => use(b.dataset.lb)); };
      const use = async text => { closeSheet(); if (/^master\b/i.test(text)) toast('Tip: “Master” is flagged as bias wording – “Primary” is suggested');
        if (editing) { pushUndo(); editing.text = text; markDirty(); draw(); renderPanel(); } else { SK.pendingLabel = text; SK.mode = 'label'; SK.sel = null; renderPanel(); } };
      q.oninput = list; list();
      sh.querySelector('#lbUse').onclick = () => { const t = q.value.trim(); if (!t) return toast('Type the label first'); const isNew = !allLabels().includes(t); if (isNew) SK.lib.labels.push(t); use(t); if (isNew) { saveLib(); toast(`“${t}” saved to your labels`); } };
    });
}
function openTotals() {
  const T = totals(); const f = n => (n || 0).toLocaleString();
  const lv = Object.entries(T.levels).sort((a, b) => LEVELS.indexOf(a[0]) - LEVELS.indexOf(b[0]));
  const row = (l, v) => `<tr><td>${esc(l)}</td><td class="n">${f(v)}</td></tr>`;
  openSheet(`<h3>Area totals (UAD 3.6)</h3><table class="tot"><tbody>
    ${row('Finished above grade', T.agFin)}${T.agNon ? row('Finished above grade – nonstandard', T.agNon) : ''}${row('Unfinished above grade', T.agUnf)}
    ${row('Finished below grade', T.bgFin)}${T.bgNon ? row('Finished below grade – nonstandard', T.bgNon) : ''}${row('Unfinished below grade', T.bgUnf)}</tbody></table>
    <h4>By level</h4><table class="tot"><thead><tr><th>Level</th><th class="n">Finished</th><th class="n">Nonstd.</th><th class="n">Unfinished</th></tr></thead><tbody>
    ${lv.map(([l, v]) => `<tr><td>${LEVEL_NAME(l)}${below(l) ? ' (below grade)' : ''}</td><td class="n">${f(v.fin)}</td><td class="n">${f(v.non)}</td><td class="n">${f(v.unf)}</td></tr>`).join('') || '<tr><td colspan="4">No living areas yet</td></tr>'}</tbody></table>
    ${[['Garage / carport', T.gar], ['Outdoor living', T.out], ['Outbuildings', T.ob], ['ADUs', T.adu], ['Amenities', T.amen]].filter(([, a]) => a.length).map(([h, a]) => `<h4>${h}</h4><table class="tot"><tbody>${a.map(x => row(x.name, x.sf)).join('')}</tbody></table>`).join('')}
    <p class="help">Areas drawn inside another area on the same level (for example a garage inside the house outline) are subtracted from it. Totals go to the inspection when you press Back or Save to inspection.</p>
    <div class="row"><button class="btn primary" id="tSend">Save totals + sketch image to inspection</button><button class="btn" data-close>Close</button></div>`, sh => sh.querySelector('#tSend').onclick = async () => { closeSheet(); toast('Saving to the inspection…'); await pushToInspection(true); toast('Sketch image and totals saved to the inspection'); });
}
function openMenu() {
  openSheet(`<h3>More</h3><div class="grid-btns col">
    <button class="btn" id="mSend">Save totals + sketch image to inspection</button>
    <button class="btn" id="mRotAll">Rotate the whole sketch…</button>
    <button class="btn" id="mVers">Saved versions (restore)</button>
    <button class="btn" id="mTypes">My area types and labels</button>
    <button class="btn" id="mExport">Export my area types and labels</button>

      sh.querySelector('#mRotAll').onclick = () => askNumber('Rotate the whole sketch', 'Degrees counter-clockwise (e.g. 90, -90, 15)', '90', v => rotateAll(v));

      sh.querySelector('#mExport').onclick = () => { const b = new Blob([JSON.stringify({ kind: 'sketch-library', defs: SK.lib.defs, labels: SK.lib.labels, hidden: SK.lib.hidden }, null, 1)], { type: 'application/json' }); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = 'sketch-area-types-and-labels.json'; a.click(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
      sh.querySelector('#mImport').onchange = async e => { try { const j = JSON.parse(await e.target.files[0].text()); if (j.kind !== 'sketch-library') throw 0; const ids = new Set(SK.lib.defs.map(d => d.id)); (j.defs || []).forEach(d => { if (!ids.has(d.id)) SK.lib.defs.push(d); }); SK.lib.labels = [...new Set([...SK.lib.labels, ...(j.labels || [])])]; await saveLib(); closeSheet(); toast('Imported'); } catch (x) { toast('That is not a sketch library file'); } };
    });

function openVersions() {
  const v = (SK.sk.versions || []).slice().reverse();
  openSheet(`<h3>Saved versions</h3><p class="help">A version is kept each time you close an area, delete, or rotate (and about once a minute while you work). Restoring keeps your current drawing as a version too.</p>

    <div class="row"><button class="btn" data-close>Close</button></div>`, sh => sh.querySelectorAll('[data-ver]').forEach(b => b.onclick = () => { const x = SK.sk.versions[+b.dataset.ver]; snapshotVersion('before restore'); pushUndo(); SK.sk.areas = JSON.parse(JSON.stringify(x.areas)); SK.sk.labels = JSON.parse(JSON.stringify(x.labels)); SK.sel = null; closeSheet(); markDirty(); renderLevels(); fitView(); draw(); renderPanel(); toast('Version restored'); }));
}
function openMyTypes() {
  openSheet(`<h3>My area types and labels</h3><h4>Area types I added</h4>
    <div class="grid-btns col">${SK.lib.defs.map(d => `<div class="lrow"><span><small>${esc(d.code)}</small> ${esc(d.name)} – ${esc(BUCKETS[d.bucket].l)}</span><button class="btn sm danger" data-rmdef="${esc(d.id)}">Remove</button></div>`).join('') || '<p class="help">None yet. Use “+ New area type”.</p>'}</div>
    <h4>Labels I added</h4><div class="grid-btns col">${SK.lib.labels.map(l => `<div class="lrow"><span>${esc(l)}</span><button class="btn sm danger" data-rmlb="${esc(l)}">Remove</button></div>`).join('') || '<p class="help">None yet.</p>'}</div>

      sh.querySelectorAll('[data-rmdef]').forEach(b => b.onclick = async () => { SK.lib.defs = SK.lib.defs.filter(d => d.id !== b.dataset.rmdef); SK.lib.hidden = SK.lib.hidden || []; await saveLib(); openMyTypes(); });
      sh.querySelectorAll('[data-rmlb]').forEach(b => b.onclick = async () => { SK.lib.labels = SK.lib.labels.filter(l => l !== b.dataset.rmlb); await saveLib(); openMyTypes(); });

    SK.sk.areas.filter(a => a.level === lv && a.closed).sort((a, b2) => polyArea(shape(b2)) - polyArea(shape(a))).forEach(a => { g.fillStyle = BUCKETS[defOf(a.def).bucket].fill; g.beginPath(); shape(a).forEach((p, i) => i ? g.lineTo(...T(p)) : g.moveTo(...T(p))); g.closePath(); g.fill(); });

        if (a.closed) { const tp = [b.x0 + (mx + nx * 8 - xoff) / s, b.y0 + (my + ny * 8 - pad - 60) / s]; if (inPoly(tp, shape(a))) { nx = -nx; ny = -ny; } }

      if (a.closed) { const [cx, cy] = T(labelPoint(a, C)); g.textAlign = 'center'; g.fillStyle = '#111'; g.font = '700 24px system-ui,sans-serif'; g.fillText(a.name || defOf(a.def).name, cx, cy - 4); g.font = '22px system-ui,sans-serif'; g.fillText(Math.round(C.net.get(a.id)).toLocaleString() + ' sf', cx, cy + 24); } });
    SK.sk.labels.filter(l => l.level === lv).forEach(l => { const [X, Y] = T([l.x, l.y]); g.textAlign = 'center'; g.font = '600 22px system-ui,sans-serif'; g.fillStyle = '#1a3a8a'; g.fillText(l.text, X, Y + 6); });
    xoff += b.w * s + gap * s; });
  // area table (Apex style)
  const T = totals(); let y = pad + 20; const x0 = W - tableW - 30; g.textAlign = 'left'; g.fillStyle = '#111'; g.font = '700 30px system-ui,sans-serif'; g.fillText('Area calculations', x0, y); y += 44;
  const line = (l, v, b) => { g.font = `${b ? 700 : 400} 24px system-ui,sans-serif`; g.textAlign = 'left'; g.fillText(l, x0, y); g.textAlign = 'right'; g.fillText((v || 0).toLocaleString() + ' sf', x0 + tableW - 20, y); y += 34; };

/* ---------- leaving ---------- */
async function goBack() { const b = document.getElementById('skBack'); if (b) b.textContent = 'Saving…'; try { await pushToInspection(SK.sk.areas.some(a => a.closed)); } catch (e) {} location.href = 'index.html?open=' + encodeURIComponent(SK.ins.id) + '&tab=' + encodeURIComponent(SK.retTab); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && SK.sk) { saveSketch(); } });

/* ---------- boot ---------- */
function skFatal(msg) { const el = document.getElementById('app'); el.innerHTML = `<div class="fatal"><h2>The sketch could not open</h2><p>Your inspection is not affected.</p><p class="fatal-msg">${esc(msg)}</p><div class="row"><a class="btn primary" href="index.html${SK.ins ? '?open=' + encodeURIComponent(SK.ins.id) : ''}">Back to the inspection</a><button class="btn" onclick="location.reload()">Try again</button></div></div>`; }
window.addEventListener('error', e => { if (!e.message || /ResizeObserver|Script error/.test(e.message)) return; try { saveSketch(); } catch (x) {} toast('Sketch error: ' + e.message); });
(async function skBoot() {
  const q = new URLSearchParams(location.search); const id = q.get('ins'); SK.retTab = q.get('tab') || 'interior';
  const ok = await Promise.race([DB.ready, new Promise(r => setTimeout(() => r('timeout'), 8000))]);
  if (ok === 'timeout') return skFatal('The iPad storage is not responding. Close the app fully and open it again.');
  if (!id) return skFatal('No inspection was chosen. Open the sketch from an inspection.');
  SK.ins = await DB.get('inspections', id); if (!SK.ins) return skFatal('That inspection was not found on this iPad.');
